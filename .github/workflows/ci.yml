name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Verify pinned build environment
        shell: bash
        run: |
          xcode_version="$(xcodebuild -version)"
          [[ "${xcode_version%%$'\n'*}" == "Xcode 26.6" ]]
          printf '%s\n' "$xcode_version"
          swift --version

      - name: Check changed-file whitespace
        shell: bash
        run: |
          if [[ -n "${{ github.base_ref }}" ]]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git show --check --format= HEAD
          fi

      - name: Run test suite
        run: |
          env \
            SWIFT_MODULECACHE_PATH="$PWD/.build/module-cache" \
            CLANG_MODULE_CACHE_PATH="$PWD/.build/clang-cache" \
            swift test -Xswiftc -warnings-as-errors

      - name: Check architecture ratchets
        run: ./scripts/check_architecture_ratchets.sh

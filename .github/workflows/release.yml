name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out release revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate release version
        id: version
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
              echo "Manual releases must run from the $DEFAULT_BRANCH branch." >&2
              exit 64
            fi
            tag="v${REQUESTED_VERSION#v}"
          else
            tag="$GITHUB_REF_NAME"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a semantic version tag such as v0.1.0" >&2
            exit 64
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "value=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Verify pinned build environment
        shell: bash
        run: |
          xcode_version="$(xcodebuild -version)"
          [[ "${xcode_version%%$'\n'*}" == "Xcode 26.6" ]]
          printf '%s\n' "$xcode_version"
          swift --version

      - name: Run test suite
        run: |
          env \
            SWIFT_MODULECACHE_PATH="$PWD/.build/module-cache" \
            CLANG_MODULE_CACHE_PATH="$PWD/.build/clang-cache" \
            swift test -Xswiftc -warnings-as-errors

      - name: Verify GitHub App configuration
        env:
          SPEDITO_GITHUB_CLIENT_ID: ${{ vars.SPEDITO_GITHUB_CLIENT_ID }}
          SPEDITO_GITHUB_APP_SLUG: ${{ vars.SPEDITO_GITHUB_APP_SLUG }}
        run: |
          [[ -n "$SPEDITO_GITHUB_CLIENT_ID" ]]
          [[ -n "$SPEDITO_GITHUB_APP_SLUG" ]]

      - name: Build application bundle
        env:
          SPEDITO_VERSION: ${{ steps.version.outputs.value }}
          SPEDITO_BUILD_NUMBER: ${{ github.run_number }}
          SPEDITO_GITHUB_CLIENT_ID: ${{ vars.SPEDITO_GITHUB_CLIENT_ID }}
          SPEDITO_GITHUB_APP_SLUG: ${{ vars.SPEDITO_GITHUB_APP_SLUG }}
        run: ./scripts/build_app.sh release

      - name: Verify application signature
        run: codesign --verify --deep --strict .build/app/release/Spedito.app

      - name: Fetch pinned create-dmg
        env:
          CREATE_DMG_REVISION: 118f131aa57c1278aca806eb37cf5021e9064198
        run: |
          tool_dir="$RUNNER_TEMP/create-dmg"
          git init "$tool_dir"
          git -C "$tool_dir" remote add origin https://github.com/create-dmg/create-dmg.git
          git -C "$tool_dir" fetch --depth 1 origin "$CREATE_DMG_REVISION"
          git -C "$tool_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$tool_dir" rev-parse HEAD)" = "$CREATE_DMG_REVISION"
          echo "CREATE_DMG_EXECUTABLE=$tool_dir/create-dmg" >> "$GITHUB_ENV"

      - name: Build installation disk image and checksum
        id: artifact
        shell: bash
        run: |
          dmg="Spedito.dmg"
          checksum="Spedito-${{ steps.version.outputs.value }}-SHA256.txt"
          ./scripts/build_dmg.sh \
            .build/app/release/Spedito.app \
            "$dmg"
          ./scripts/verify_dmg.sh "$dmg"
          shasum -a 256 "$dmg" > "$checksum"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          remote_commit="$(
            git ls-remote origin "refs/tags/$RELEASE_TAG^{}" | awk 'NR == 1 { print $1 }'
          )"
          if [[ -z "$remote_commit" ]]; then
            remote_commit="$(
              git ls-remote origin "refs/tags/$RELEASE_TAG" | awk 'NR == 1 { print $1 }'
            )"
          fi
          if [[ -n "$remote_commit" ]]; then
            if [[ "$remote_commit" != "$GITHUB_SHA" ]]; then
              echo "The tag $RELEASE_TAG already points to another revision." >&2
              exit 65
            fi
            echo "Reusing $RELEASE_TAG from this release revision."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "Spedito $RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            "${{ steps.artifact.outputs.dmg }}" \
            "${{ steps.artifact.outputs.checksum }}" \
            --verify-tag \
            --latest \
            --title "Spedito $RELEASE_TAG — early preview" \
            --notes "Early preview: open the DMG and drag Spedito to Applications. This Apple Silicon build is ad-hoc signed, not notarized, and provided without warranty. Back up important repositories and review the README before use." \
            --generate-notes
